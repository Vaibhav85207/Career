<!doctype html><html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827"><title>Career Sprint</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f3f4f6;color:#111827}
header{background:#111827;color:#fff;padding:20px 16px}header h1{margin:0}header p{margin:5px 0;color:#cbd5e1;font-size:13px}
nav{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;background:#fff;padding:8px;position:sticky;top:0;z-index:5}
nav button{border:0;background:#eef2f7;border-radius:9px;padding:11px 2px;font-weight:700;font-size:11px}
nav button.active{background:#111827;color:#fff}main{max-width:850px;margin:auto;padding:15px}.page{display:none}.page.active{display:block}
.card{background:#fff;border-radius:15px;padding:15px;margin:12px 0;box-shadow:0 2px 10px #0001}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.stat{background:#f8fafc;padding:12px;border-radius:10px}.big{font-size:34px;font-weight:800}.muted{color:#6b7280;font-size:13px}
.bar{height:9px;background:#e5e7eb;border-radius:9px;overflow:hidden}.fill{height:100%;background:#16a34a}
.check{display:flex;gap:9px;padding:9px 0;border-bottom:1px solid #eee}.check input{accent-color:#16a34a}
.action{border:0;background:#111827;color:white;border-radius:9px;padding:11px 14px;font-weight:700}
.secondary{background:#e5e7eb;color:#111827}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.day,.dow{min-height:38px;display:flex;align-items:center;justify-content:center;border-radius:8px;font-size:12px}
.dow{font-weight:bold;color:#6b7280}.day{background:#eef2f7;cursor:pointer}.day.done{background:#22c55e;color:#fff;font-weight:bold}.day.today{outline:3px solid #111827}
.day.empty{background:transparent;cursor:default}textarea{width:100%;min-height:180px;padding:12px;border:1px solid #d1d5db;border-radius:10px;font:inherit}
.phase{border-left:4px solid #111827}
@media(max-width:600px){.grid{grid-template-columns:1fr 1fr}}
</style></head><body>
<header><h1>🚀 Career Sprint</h1><p>24-week Product Company + Data & AI Engineer tracker</p></header>
<nav id="nav"></nav><main>
<section id="dashboard" class="page active"><h2>Dashboard</h2>
<div class="card"><div class="muted">Overall readiness</div><div class="big" id="overall">0%</div><div class="bar"><div id="overallBar" class="fill"></div></div></div>
<div id="skills" class="grid"></div><div class="card"><h3>Study streak</h3><div class="big"><span id="streak">0</span> days</div></div></section>

<section id="today" class="page"><h2>Today</h2><div class="card"><b id="todayDate"></b>
<h3>Recommended 4-hour session</h3><div id="todayTasks"></div><button id="completeToday" class="action">✓ Mark today complete</button></div>
<div class="card"><h3>Calendar</h3><div id="calendar" class="calendar"></div><p class="muted">🟩 completed · ⬜ not completed · outlined = today. Tap any date.</p></div></section>

<section id="quiz" class="page"><h2>Interview Quiz</h2><div id="quizList" class="card"></div></section>
<section id="roadmap" class="page"><h2>24-Week Roadmap</h2><div id="roadmapList"></div></section>
<section id="notes" class="page"><h2>Notes</h2><div class="card"><textarea id="notesText" placeholder="Write interview notes and STAR stories..."></textarea><br><br><button id="saveNotes" class="action">Save notes</button><span id="saved" class="muted"></span></div>
<div class="card"><h3>STAR checklist</h3><div id="star"></div></div><div class="card"><button id="reset" class="action secondary">Reset all data</button></div></section>
</main>
<script>
const KEY="careerSprintV5";
const phases=[
["SQL",["Joins and CTEs","Window functions","Advanced SQL","Query optimization","70+ problems"]],
["Python",["Core Python","Collections","Generators/files","APIs/logging/retries"]],
["DSA",["Arrays/strings","HashMap/Set","Sliding window","Stack/queue","Binary search","Trees/BFS/DFS","Heap/graphs"]],
["Data Modeling",["OLTP vs OLAP","Facts/dimensions","Star schema","SCD1/SCD2","Grain and keys"]],
["Spark / PySpark",["Architecture","Partitions/shuffle","PySpark APIs","Joins/windows","Caching","Skew/salting/AQE","Memory/files"]],
["Databricks / Delta",["Clusters/workflows","Unity Catalog","Delta ACID","MERGE/CDC","Time travel","OPTIMIZE/Z-order","Liquid clustering/VACUUM"]],
["Azure",["ADF","Integration Runtime","Parameters","Metadata-driven ETL","ADLS security","DevOps CI/CD"]],
["Kafka / Streaming",["Topics/partitions","Offsets/groups","Replication","Structured Streaming","Checkpoints/watermarks","Late data/idempotency"]],
["System Design",["Requirements/scale","Architecture","Data model","Reliability","Scalability","Security","Monitoring/cost"]],
["ML",["Regression/classification","Trees/ensembles","Clustering","Train/validation/test","Leakage/overfitting","Metrics"]],
["ML Engineering",["Features","ML pipelines","MLflow","Registry","Batch/realtime","Drift/retraining"]],
["LLMs",["Tokens/embeddings","Transformers/attention","Context","Prompting","Inference","Fine-tuning"]],
["RAG",["Parsing","Chunking","Embeddings","Vector DB","Similarity search","Metadata filters","Hybrid/reranking","Evaluation"]],
["AI System Design",["Enterprise RAG","Real-time ML","Recommendations","AI platform","LLM analytics","Scaling/security"]],
["Capstone",["Incremental ingestion","CDC","Medallion","SCD2","Data quality","Spark optimization","Kafka","MLflow","RAG/LLM","CI/CD"]]
];
const quiz=[
["Repartition vs coalesce?","Repartition can increase or decrease partitions and normally shuffles. Coalesce usually reduces partitions with less shuffle."],
["How do you handle Spark skew?","Use AQE/skew handling, broadcast suitable small tables, or salt hot keys."],
["Why Delta instead of Parquet?","Delta adds transaction log, ACID, schema controls, MERGE and time travel."],
["What is SCD2?","A history-preserving dimension pattern that creates a new row when tracked attributes change."],
["Kafka consumer group?","Consumers in one group share partitions; one partition is assigned to one consumer in that group at a time."],
["What is a watermark?","An event-time progress threshold used to control late data and state retention."],
["Incremental ingestion design?","Use CDC or a reliable watermark, persist the last successful value, validate, and make retries idempotent."],
["What is RAG?","Retrieve relevant external knowledge and give it to an LLM as context before generation."],
["How improve RAG?","Better parsing/chunking, metadata filters, hybrid retrieval, reranking, query rewriting and evaluation."],
["Production-ready pipeline?","Idempotency, retries, checkpoints, data quality, observability, security, alerts and CI/CD."],
["Optimize a slow Spark job?","Inspect Spark UI/plan, reduce shuffle, choose joins carefully, handle skew, prune data and optimize files."]
];
let state=JSON.parse(localStorage.getItem(KEY)||'{"tasks":{},"days":{},"quiz":{},"notes":"","star":{}}');

const nav=document.getElementById("nav");
["dashboard","today","quiz","roadmap","notes"].forEach(id=>{
 let b=document.createElement("button");b.textContent=id[0].toUpperCase()+id.slice(1);b.onclick=()=>show(id);b.dataset.id=id;nav.appendChild(b);
});
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function show(id){
 document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
 document.getElementById(id).classList.add("active");
 document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("active",x.dataset.id===id));
 if(id==="dashboard")renderDashboard(); if(id==="today")renderToday(); if(id==="quiz")renderQuiz(); if(id==="roadmap")renderRoadmap(); if(id==="notes")renderNotes();
}
function allKeys(){return phases.flatMap((p,i)=>p[1].map((_,j)=>i+"-"+j))}
function progress(){let a=allKeys();return Math.round(a.filter(k=>state.tasks[k]).length/a.length*100)}
function dateKey(d){return d.toISOString().slice(0,10)}
function streakCalc(){let d=new Date(),n=0;while(state.days[dateKey(d)]){n++;d.setDate(d.getDate()-1)}return n}
function renderDashboard(){
 let p=progress();overall.textContent=p+"%";overallBar.style.width=p+"%";streak.textContent=streakCalc();
 skills.innerHTML=phases.slice(0,9).map((p,i)=>{let q=Math.round(p[1].filter((_,j)=>state.tasks[i+"-"+j]).length/p[1].length*100);return '<div class="stat"><b>'+p[0]+'</b><div>'+q+'%</div><div class="bar"><div class="fill" style="width:'+q+'%"></div></div></div>'}).join("");
}
function renderToday(){
 let d=new Date(),k=dateKey(d);todayDate.textContent=d.toLocaleDateString(undefined,{weekday:"long",year:"numeric",month:"long",day:"numeric"});
 todayTasks.innerHTML=["SQL / Python","Spark / Databricks","System Design","AI / ML / RAG"].map(x=>'<div class="check">☐ '+x+'</div>').join("");
 completeToday.textContent=state.days[k]?"✓ Today completed":"✓ Mark today complete";
 completeToday.onclick=()=>{state.days[k]=!state.days[k];save();renderToday();renderDashboard()};renderCalendar(d);
}
function renderCalendar(now){
 let y=now.getFullYear(),m=now.getMonth(),first=new Date(y,m,1),last=new Date(y,m+1,0),start=(first.getDay()+6)%7;
 let out=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(x=>'<div class="dow">'+x+'</div>').join("");
 for(let i=0;i<start;i++)out+='<div class="day empty"></div>';
 for(let n=1;n<=last.getDate();n++){let d=new Date(y,m,n),k=dateKey(d);out+='<div class="day '+(state.days[k]?"done ":"")+(k===dateKey(now)?"today":"")+'" data-k="'+k+'">'+n+'</div>'}
 calendar.innerHTML=out;calendar.querySelectorAll("[data-k]").forEach(x=>x.onclick=()=>{state.days[x.dataset.k]=!state.days[x.dataset.k];save();renderCalendar(now);renderDashboard()});
}
function renderQuiz(){
 quizList.innerHTML=quiz.map((q,i)=>'<div><b>'+(i+1)+'. '+q[0]+'</b><p class="muted">'+q[1]+'</p><label class="check"><input type="checkbox" data-q="'+i+'" '+(state.quiz[i]?"checked":"")+'> I can answer confidently</label></div>').join("");
 quizList.querySelectorAll("[data-q]").forEach(x=>x.onchange=()=>{state.quiz[x.dataset.q]=x.checked;save()});
}
function renderRoadmap(){
 roadmapList.innerHTML=phases.map((p,i)=>'<div class="card phase"><h3>Phase '+(i+1)+': '+p[0]+'</h3>'+p[1].map((x,j)=>'<label class="check"><input type="checkbox" data-t="'+i+'-'+j+'" '+(state.tasks[i+"-"+j]?"checked":"")+'>'+x+'</label>').join("")+'</div>').join("");
 roadmapList.querySelectorAll("[data-t]").forEach(x=>x.onchange=()=>{state.tasks[x.dataset.t]=x.checked;save();renderRoadmap();renderDashboard()});
}
function renderNotes(){
 notesText.value=state.notes||"";
 star.innerHTML=["Situation","Task","Action","Result","Learning"].map((x,i)=>'<label class="check"><input type="checkbox" data-s="'+i+'" '+(state.star[i]?"checked":"")+'>'+x+'</label>').join("");
 star.querySelectorAll("[data-s]").forEach(x=>x.onchange=()=>{state.star[x.dataset.s]=x.checked;save()});
}
saveNotes.onclick=()=>{state.notes=notesText.value;save();saved.textContent=" Saved ✓";setTimeout(()=>saved.textContent="",1200)};
reset.onclick=()=>{if(confirm("Reset all progress?")){state={tasks:{},days:{},quiz:{},notes:"",star:{}};save();show("dashboard")}};
renderDashboard();show("dashboard");
</script></body></html>
